<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LB Title | Automotive Title, Lien & Dealer Services</title>

  <meta
    name="description"
    content="LB Title provides automotive title, lien and dealer-support services."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;

      background:
        radial-gradient(circle at top, #111827 0%, #070b12 45%, #030509 100%);

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 20px;

      color: #64748b;

      font-size: 0.72rem;
      font-weight: 700;

      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .brand {
      font-size: clamp(3.4rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 0.95;
    }

    .brand span {
      color: #3b82f6;
    }

    .tagline {
      margin-top: 24px;

      color: #cbd5e1;

      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 600;
    }

    .line {
      width: 70px;
      height: 3px;

      margin: 32px auto;

      background: #3b82f6;
      border-radius: 999px;
    }

    .description {
      max-width: 610px;
      margin: 0 auto;

      color: #94a3b8;

      font-size: 1.05rem;
      line-height: 1.7;
    }

    .coming-soon {
      margin-top: 42px;

      color: #64748b;

      font-size: 0.76rem;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .contact {
      margin-top: 25px;
    }

    .contact p {
      margin-bottom: 15px;
      color: #cbd5e1;
    }

    .button {
      display: inline-block;

      padding: 14px 28px;

      border: 1px solid #3b82f6;
      border-radius: 8px;

      color: #ffffff;

      font-weight: 700;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .button:hover {
      background: #3b82f6;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 70px;

      color: #475569;

      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }

    footer strong {
      color: #64748b;
    }

    @media (max-width: 500px) {
      .brand {
        letter-spacing: -3px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="eyebrow">
      Coming Soon
    </div>

    <h1 class="brand">
      LB <span>TITLE</span>
    </h1>

    <div class="tagline">
      Automotive Title • Lien • Dealer Services
    </div>

    <div class="line"></div>

    <p class="description">
      Professional automotive title, lien and dealer-support
      services for automotive businesses.
    </p>

    <div class="coming-soon">
      Full Website Coming Soon
    </div>

    <div class="contact">
      <p>Need service now?</p>

      <a class="button" href="tel:+15147032750">
        Call 514-703-2750
      </a>
    </div>

    <footer>
      Powered by <strong>VALRYN OS</strong>
    </footer>

  </main>

</body>
</html>
